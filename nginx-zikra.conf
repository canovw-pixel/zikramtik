server {
    server_name zikramatik.com;
    root /var/www/zikra/frontend/build;
    index index.html;
    location ^~ /api/uploads/ {
        alias /var/www/zikra/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /wp-json {
        proxy_pass http://127.0.0.1:8001/wp-json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /wp-json/ {
        proxy_pass http://127.0.0.1:8001/wp-json/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /wp-admin/ {
        proxy_pass http://127.0.0.1:8001/wp-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /wc-auth/ {
        proxy_pass http://127.0.0.1:8001/wc-auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/zikramatik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zikramatik.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    server_name www.zikramatik.com;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/zikramatik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zikramatik.com/privkey.pem;
    return 301 https://zikramatik.com$request_uri;
}
server {
    listen 80;
    server_name zikramatik.com www.zikramatik.com;
    return 301 https://zikramatik.com$request_uri;
}
